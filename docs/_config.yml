title: OuEstCharlie Woof
description: Local photo gallery, AI-native — built on open standards (XMP, MCP Apps, LanceDB) and privacy
baseurl: ""
url: "https://ouestcharlie.github.io"

theme: minima

author: (c) Antoine Hue

logo: /assets/woof_large_850.png
image: /assets/woof_large_850.png

# Latest Woof bundle (MCPB) for Claude Desktop. The release asset name carries
# the version, so update this at each Woof release.
woof_mcpb_url: "https://github.com/ouestcharlie/ouestcharlie-woof/releases/download/v0.15.2/ouestcharlie-woof-0.15.2.mcpb"

webmaster_verifications:
  google: QijdD5JeZEHGIIQqeqRfpfqpHdSptNb7PUGA_a6DAkY

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

sass:
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: "google*.html"
    values:
      sitemap: false
